---
# Common variables for all environments
app_name: "rea-interactive-bible-BE"
app_user: "interactive-bible"
ansible_user: "ubuntu"
domain_name:  "seisho.emerj.net"
email: "ceo@Seisho.emerge.net"
app_directory: "/opt/bible-app/{{ app_name }}"
repository_url: "https://github.com/hngprojects/rea-interactive-bible-BE"

# System settings
nodejs_version: "18"
nginx_sites_enabled: "/etc/nginx/sites-enabled"
nginx_sites_available: "/etc/nginx/sites-available"

# CloudWatch settings
cloudwatch_log_group: "/aws/ec2/{{ app_name }}/{{ env_name }}"
cloudwatch_region: "us-west-2"

# SSL settings
certbot_email: "{{ email }}"
ssl_cert_path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
ssl_key_path: "/etc/letsencrypt/live/{{ domain_name }}/privkey.pem"

# Application logs
app_log_dir: "/var/log/{{ app_name }}"