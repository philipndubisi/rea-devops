---
# Production environment specific variables
env_name: "production"

# Domain configurations for production
frontend_domain: "seisho.emerj.net"
backend_domain: "api.seisho.emerj.net"

# Port mappings for production
frontend_port: "3001"
backend_port: "3600"

# Resource allocation for production
nginx_worker_connections: "2048"
client_max_body_size: "500M"

# Logging configuration for production (minimal for performance)
log_level: "error"
log_format_type: "json"  # Structured logging for production
log_retention_days: "90"
nginx_log_retention_days: "365"
error_log_retention_days: "30"
log_rotation_size: "500M"
nginx_log_rotation_size: "1G"
error_log_rotation_size: "100M"

# Rate limiting for production (strict)
api_rate_limit: "10r/s"
auth_rate_limit: "3r/m"
global_rate_limit: "100r/s"
api_burst: "20"
auth_burst: "5"
global_burst: "50"

# Caching settings for production (aggressive)
enable_api_cache: true
cache_zone_size: "50m"
cache_max_size: "5g"
cache_inactive_time: "120m"
api_cache_time: "10m"
error_cache_time: "5m"
static_cache_time: "1y"

# Timeout configuration for production
proxy_timeout: "600s"
api_timeout: "120s"

# CORS settings for production
cors_origin: "https://seisho.emerj.net"

# Feature flags for production
enable_api_docs: false
debug_enabled: false

# SSL settings for production
ssl_cert_path: "/etc/letsencrypt/live/seisho.emerj.net/fullchain.pem"
ssl_key_path: "/etc/letsencrypt/live/seisho.emerj.net/privkey.pem"

# Gzip compression for production (maximum)
gzip_compression_level: "9"

# SSL Session configuration for production
ssl_session_cache_size: "10m"
ssl_session_timeout: "10m"

# DNS settings for production
dns_resolver: "8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1"  # Multiple resolvers for reliability

# Log rotation notification (enabled for production)
log_rotation_notify: true

# CloudWatch settings for production
cloudwatch_log_group: "/aws/ec2/production/{{ app_name }}"
cloudwatch_region: "us-west-2"

# Additional security settings for production
security_headers:
  strict_transport_security: "max-age=31536000; includeSubDomains; preload"
  content_security_policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; frame-ancestors 'none'"
  x_content_type_options: "nosniff"
  x_frame_options: "DENY"
  referrer_policy: "strict-origin-when-cross-origin"

# Performance optimization for production
nginx_optimization:
  sendfile: "on"
  tcp_nopush: "on"
  tcp_nodelay: "on"
  open_file_cache: "max=200000 inactive=20s"
  open_file_cache_valid: "30s"
  open_file_cache_min_uses: "2"
  open_file_cache_errors: "on"

# Connection limits for production
nginx_limits:
  worker_rlimit_nofile: "65536"
  events_use: "epoll"
  multi_accept: "on"