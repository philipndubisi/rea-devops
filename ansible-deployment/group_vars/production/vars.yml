---
# Production Environment Variables - Backend API Only
env_name: production
app_port: 3600
node_env: production
branch_name: main
# Git settings
git_branch: main

debug_enabled: false
log_level: error
pm2_instances: 4  # Scale based on server CPU cores

# Backend-specific configuration
backend_only: true
api_only_deployment: true
frontend_enabled: false
high_availability: true

# Domain and SSL for production API
domain_name: "api.seisho.emerj.net"
server_name: "seisho.emerj.net"
api_base_url: "https://api.seisho.emerj.net"

# Database and external services (production)
db_host: "127.0.0.1"
db_name: "seisho_db"
redis_host: "prod-redis.internal"
redis_port: 6379

# MongoDB Configuration
mongodb_port: 27017
mongodb_bind_ip: "127.0.0.1"
mongodb_auth_enabled: true
mongodb_username: "{{ mongodb_credentials.production.username }}"
mongodb_password: "{{ mongodb_credentials.production.password }}"
mongodb_database_name: "{{ mongodb_credentials.production.database }}"
mongodb_max_connections: 5000
mongodb_slow_op_threshold: 50
mongodb_profiling_mode: "slowOp"
mongodb_replica_set: "rs0"
mongodb_sharding_enabled: false

# API Configuration
api_version: "v1"
api_prefix: "/api/v1"
cors_origins:
  - "https://seisho.emerj.net"
  - "https://www.seisho.emerj.net"
  - "https://app.seisho.emerj.net"

# Production monitoring and health checks
health_check_interval: 60
health_check_endpoint: "/api/v1/health"
metrics_enabled: true
performance_monitoring: true

# SSL configuration for production API
ssl_enabled: true
force_https: true

# Production security settings
rate_limit_enabled: true
rate_limit_max: 5000
rate_limit_window: 900  # 15 minutes
security_headers: true
ddos_protection: true

# Logging configuration
log_format: "json"
log_rotation: true
max_log_files: 30
max_log_size: "500M"
log_retention_days: 90

# Performance tuning
max_connections: 1000
connection_timeout: 30
keepalive_timeout: 75
worker_processes: auto
worker_connections: 1024
