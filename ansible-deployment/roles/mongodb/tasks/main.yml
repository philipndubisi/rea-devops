---
# MongoDB installation and configuration tasks

- name: Import MongoDB public GPG key
  apt_key:
    url: https://www.mongodb.org/static/pgp/server-7.0.asc
    state: present

- name: Add MongoDB repository
  apt_repository:
    repo: "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu {{ ansible_distribution_release }}/mongodb-org/7.0 multiverse"
    state: present
    update_cache: yes

- name: Install MongoDB
  apt:
    name:
      - mongodb-org
      - mongodb-org-server
      - mongodb-org-shell
      - mongodb-org-mongos
      - mongodb-org-tools
    state: present
    update_cache: yes

- name: Create MongoDB data directory
  file:
    path: /var/lib/mongodb
    state: directory
    owner: mongodb
    group: mongodb
    mode: '0755'

- name: Create MongoDB log directory
  file:
    path: /var/log/mongodb
    state: directory
    owner: mongodb
    group: mongodb
    mode: '0755'

- name: Configure MongoDB
  template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: restart mongod

- name: Start and enable MongoDB service
  systemd:
    name: mongod
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for MongoDB to start
  wait_for:
    port: 27017
    host: localhost
    delay: 10
    timeout: 60