---
# Common handlers

- name: reload ufw
  service:
    name: ufw
    state: reloaded

- name: restart fail2ban
  service:
    name: fail2ban
    state: restarted

- name: restart mongod
  ansible.builtin.systemd:
    name: mongod
    state: restarted
    enabled: yes

- name: reload mongod
  ansible.builtin.systemd:
    name: mongod
    state: reloaded

- name: restart nginx
  service:
    name: nginx
    state: restarted
