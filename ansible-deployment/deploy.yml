---
- name: Universal REA DevOps Deployment Playbook
  hosts: all
  gather_facts: yes
  become: yes
  vars_prompt:
    - name: vault_password
      prompt: "Enter Ansible Vault password"
      private: yes

  tasks:
    # Task 2.1: Dynamic Environment Configuration
    - name: Detect environment from inventory group
      set_fact:
        current_env: "{{ 'staging' if inventory_hostname in groups['staging'] else 'production' }}"
      
    - name: Display current environment
      debug:
        msg: "Deploying to {{ current_env | upper }} environment on {{ inventory_hostname }}"

    - name: Load vault variables
      include_vars: "group_vars/all/vault.yml"

    # Task 2.2: Dependency Management & Cloning
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - nginx
          - git
          - curl
          - awscli
          - build-essential
          - python3
          - python3-pip
          - certbot
          - python3-certbot-nginx
          - software-properties-common
          - gnupg
          - apt-transport-https
          - ca-certificates
          - lsb-release
        state: present

    # MongoDB Installation
    - name: Import MongoDB public GPG key
      apt_key:
        url: https://www.mongodb.org/static/pgp/server-7.0.asc
        state: present

    - name: Add MongoDB repository
      apt_repository:
        repo: "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu {{ ansible_distribution_release }}/mongodb-org/7.0 multiverse"
        state: present
        update_cache: yes

    - name: Install MongoDB
      apt:
        name:
          - mongodb-org
          - mongodb-org-server
          - mongodb-org-shell
          - mongodb-org-mongos
          - mongodb-org-tools
        state: present
        update_cache: yes

    - name: Create MongoDB data directory
      file:
        path: /var/lib/mongodb
        state: directory
        owner: mongodb
        group: mongodb
        mode: '0755'

    - name: Create MongoDB log directory
      file:
        path: /var/log/mongodb
        state: directory
        owner: mongodb
        group: mongodb
        mode: '0755'

    - name: Configure MongoDB
      template:
        src: mongod.conf.j2
        dest: /etc/mongod.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart mongodb

    - name: Configure MongoDB
      template:
        src: mongod.conf.j2
        dest: /etc/mongod.conf
        owner: mongodb
        group: mongodb
        mode: '0644'
        backup: yes
      notify: restart mongod

    - name: Start and enable MongoDB service
      systemd:
        name: mongod
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Wait for MongoDB to start
      wait_for:
        port: 27017
        host: localhost
        delay: 10
        timeout: 60

    # Node.js Installation
    - name: Add NodeSource repository key
      apt_key:
        url: https://deb.nodesource.com/gpgkey/nodesource.gpg.key
        state: present

    - name: Add NodeSource repository
      apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ nodejs_version }}.x {{ ansible_distribution_release }} main"
        state: present
        update_cache: yes

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Verify Node.js installation
      shell: node --version
      register: node_version
      changed_when: false

    - name: Display Node.js version
      debug:
        msg: "Node.js version installed: {{ node_version.stdout }}"

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Install global Node.js packages
      npm:
        name: "{{ item }}"
        global: yes
        state: present
      loop:
        - nodemon
        - forever

    - name: Install CloudWatch agent dependencies
      pip:
        name: 
          - awscli
          - boto3
          - pymongo
        state: present

    - name: Create application user
      user:
        name: "{{ app_user }}"
        shell: /bin/bash
        home: "/home/{{ app_user }}"
        create_home: yes
        system: no
        groups: mongodb
        append: yes

    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Create log directory
      file:
        path: "{{ app_log_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Create SSH directory for app user
      file:
        path: "/home/{{ app_user }}/.ssh"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0700'

    - name: Deploy private SSH key for repository access
      copy:
        content: "{{ deployment_private_key }}"
        dest: "/home/{{ app_user }}/.ssh/id_rsa"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'
      no_log: true

    - name: Add GitHub to known hosts
      known_hosts:
        name: github.com
        key: "github.com ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC7vbZ8nJG8FqPze8d8gHg3vEk/kxPltBs..."
        path: "/home/{{ app_user }}/.ssh/known_hosts"
        state: present

    - name: Clone application repository
      git:
        repo: "{{ repository_url }}"
        dest: "{{ app_directory }}"
        version: "{{ branch_name }}"
        force: yes
      become_user: "{{ app_user }}"
      environment:
        GIT_SSH_COMMAND: "ssh -i /home/{{ app_user }}/.ssh/id_rsa -o StrictHostKeyChecking=no"

    # MongoDB Database Setup
    - name: Create MongoDB database and user
      shell: |
        mongosh --eval "
        use {{ mongodb_database_name }};
        db.createUser({
          user: '{{ mongodb_username }}',
          pwd: '{{ mongodb_password }}',
          roles: [
            { role: 'readWrite', db: '{{ mongodb_database_name }}' },
            { role: 'dbAdmin', db: '{{ mongodb_database_name }}' }
          ]
        });"
      ignore_errors: yes
      no_log: true

    - name: Test MongoDB connection
      shell: |
        mongosh --eval "db.runCommand('ping').ok" {{ mongodb_database_name }}
      register: mongodb_test
      changed_when: false

    - name: Display MongoDB connection status
      debug:
        msg: "MongoDB connection: {{ 'SUCCESS' if mongodb_test.rc == 0 else 'FAILED' }}"

    # Task 2.3: Secrets Injection
    - name: Copy environment-specific secrets file
      copy:
        src: "secrets/{{ env_name }}.env"
        dest: "{{ app_directory }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0600'

    - name: Install application dependencies
      npm:
        path: "{{ app_directory }}"
        state: present
      become_user: "{{ app_user }}"

    # Task 2.4: Process Management
    - name: Create PM2 ecosystem file from template
      template:
        src: ecosystem.config.js.j2
        dest: "{{ app_directory }}/ecosystem.config.js"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0644'

    - name: Stop existing PM2 processes
      shell: pm2 delete {{ app_name }} || true
      become_user: "{{ app_user }}"
      ignore_errors: yes

    - name: Start application with PM2
      shell: pm2 start ecosystem.config.js
      args:
        chdir: "{{ app_directory }}"
      become_user: "{{ app_user }}"

    - name: Save PM2 configuration
      shell: pm2 save
      become_user: "{{ app_user }}"

    - name: Setup PM2 startup script
      shell: |
        pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }} | tail -1
      register: pm2_startup_command
      become_user: "{{ app_user }}"

    - name: Execute PM2 startup command
      shell: "{{ pm2_startup_command.stdout }}"
      when: pm2_startup_command.stdout is defined and pm2_startup_command.stdout != ""

    # Task 2.5: Nginx Templating (Reverse Proxy) 
    - name: Remove default Nginx site
      file:
        path: "{{ nginx_sites_enabled }}/default"
        state: absent

    - name: Configure Nginx site from template
      template:
        src: nginx.conf.j2
        dest: "{{ nginx_sites_available }}/{{ app_name }}_{{ env_name }}"
        mode: '0644'
      notify: reload nginx

    - name: Enable Nginx site
      file:
        src: "{{ nginx_sites_available }}/{{ app_name }}_{{ env_name }}"
        dest: "{{ nginx_sites_enabled }}/{{ app_name }}_{{ env_name }}"
        state: link
      notify: reload nginx

    # Task 2.6: SSL Certification
    - name: Check if SSL certificate exists
      stat:
        path: "{{ ssl_cert_path }}"
      register: ssl_cert_check

    - name: Generate SSL certificate with Certbot
      shell: |
        certbot --nginx -d {{ domain_name }} \
        --non-interactive --agree-tos \
        --email {{ certbot_email }} \
        --redirect
      when: not ssl_cert_check.stat.exists

    - name: Set up automatic SSL renewal
      cron:
        name: "Certbot renewal"
        minute: "0"
        hour: "12"
        day: "*"
        month: "*"
        weekday: "*"
        job: "certbot renew --quiet --nginx"

    - name: Test SSL renewal
      shell: certbot renew --dry-run
      register: certbot_test
      ignore_errors: yes

    - name: Display SSL renewal test results
      debug:
        msg: "SSL renewal test: {{ 'PASSED' if certbot_test.rc == 0 else 'FAILED' }}"

    # CloudWatch Logging Configuration
    - name: Create CloudWatch log group
      shell: |
        aws logs create-log-group --log-group-name "{{ cloudwatch_log_group }}" --region {{ cloudwatch_region }} || true
      ignore_errors: yes

    - name: Configure CloudWatch agent
      template:
        src: cloudwatch-config.json.j2
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        mode: '0644'
      notify: restart cloudwatch

    - name: Ensure services are running
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - mongod

    - name: Force HTTPS redirection
      template:
        src: nginx.conf.j2
        dest: "{{ nginx_sites_available }}/{{ app_name }}_{{ env_name }}"
        mode: '0644'
      notify: reload nginx
      when: ssl_enabled and force_https

    # Health Checks
    - name: Verify Node.js and MongoDB services
      shell: |
        echo "Node.js: $(node --version)"
        echo "npm: $(npm --version)"
        echo "PM2: $(pm2 --version)"
        echo "MongoDB: $(mongosh --version)"
      register: service_versions
      changed_when: false

    - name: Display service versions
      debug:
        msg: "{{ service_versions.stdout_lines }}"

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart mongodb
      systemd:
        name: mongod
        state: restarted

    - name: restart cloudwatch
      systemd:
        name: amazon-cloudwatch-agent
        state: restarted
        enabled: yes