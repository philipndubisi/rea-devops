---
- name: Universal REA DevOps Deployment Playbook
  hosts: all
  gather_facts: yes
  become: yes
  
  vars_files:
    - group_vars/all/all.yml
    - group_vars/all/vault.yml
    
  vars:
    env_name: "{{ group_names[0] }}"
    mongodb_database_name: "{{ mongodb_credentials[env_name].database | default('seisho_db') }}"
    mongodb_username: "{{ mongodb_credentials[env_name].username | default('seisho') }}"
    mongodb_password: "{{ mongodb_credentials[env_name].password | default('NewPass1234') }}"
    
  vars_prompt:
    - name: vault_password
      prompt: "Enter Ansible Vault password"
      private: yes

  tasks:
    # Task 2.1: Dynamic Environment Configuration
    - name: Detect environment from inventory group
      set_fact:
        current_env: "{{ 'staging' if inventory_hostname in groups['staging'] else 'production' }}"
      
    - name: Display current environment
      debug:
        msg: "Deploying to {{ env_name | upper }} environment on {{ inventory_hostname }}"

    # Task 2.2: Dependency Management & Cloning
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install system dependencies
      apt:
        name:
          - nginx
          - git
          - curl
          - awscli
          - build-essential
          - python3
          - python3-pip
          - certbot
          - python3-certbot-nginx
          - software-properties-common
          - gnupg
          - apt-transport-https
          - ca-certificates
          - lsb-release
        state: present

    # Include common role for handlers
    - include_role:
        name: common

    # Include MongoDB role
    - include_role:
        name: mongodb
      vars:
        env_name: "{{ current_env }}"

    # Node.js Installation
    - name: Add NodeSource repository key
      apt_key:
        url: https://deb.nodesource.com/gpgkey/nodesource.gpg.key
        state: present

    - name: Add NodeSource repository
      apt_repository:
        repo: "deb https://deb.nodesource.com/node_{{ nodejs_version }}.x {{ ansible_distribution_release }} main"
        state: present
        update_cache: yes

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
        update_cache: yes

    - name: Verify Node.js installation
      shell: node --version
      register: node_version
      changed_when: false

    - name: Display Node.js version
      debug:
        msg: "Node.js version installed: {{ node_version.stdout }}"

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Install global Node.js packages
      npm:
        name: "{{ item }}"
        global: yes
        state: present
      loop:
        - nodemon
        - forever

    - name: Install CloudWatch agent dependencies
      pip:
        name: 
          - awscli
          - boto3
          - pymongo
        state: present

    - name: Create application user
      user:
        name: "{{ ansible_user }}"
        shell: /bin/bash
        home: "/home/{{ ansible_user }}"
        create_home: yes
        system: no
        groups: mongodb
        append: yes

    - name: Create application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create log directory
      file:
        path: "{{ app_log_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Create SSH directory for app user
      file:
        path: "/home/{{ ansible_user }}/.ssh"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Deploy private SSH key for repository access
      copy:
        content: "{{ deployment_private_key }}"
        dest: "/home/{{ ansible_user }}/.ssh/id_rsa"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      no_log: true
      when: deployment_private_key is defined and deployment_private_key != ''

    - name: Add GitHub to known hosts (automatic)
      shell: |
        ssh-keyscan -H github.com >> /home/{{ ansible_user }}/.ssh/known_hosts
        chmod 644 /home/{{ ansible_user }}/.ssh/known_hosts
        chown {{ ansible_user }}:{{ ansible_user }} /home/{{ ansible_user }}/.ssh/known_hosts
      args:
        creates: /home/{{ ansible_user }}/.ssh/known_hosts

    - name: Test SSH key format
      shell: ssh-keygen -l -f /home/{{ ansible_user }}/.ssh/id_rsa
      become_user: "{{ ansible_user }}"
      register: ssh_key_test
      ignore_errors: yes
      when: deployment_private_key is defined

    - name: Generate public key from private key
      shell: ssh-keygen -y -f /home/{{ ansible_user }}/.ssh/id_rsa
      become_user: "{{ ansible_user }}"
      register: public_key_content
      ignore_errors: yes
      when: deployment_private_key is defined and ssh_key_test.rc == 0

    - name: Display SSH key info
      debug:
        msg: 
          - "SSH Key: {{ 'Valid' if ssh_key_test.rc == 0 else 'Invalid - ' + (ssh_key_test.stderr | default('No error message')) }}"
          - "Public Key (add this to GitHub as deploy key): {{ public_key_content.stdout | default('Not generated') }}"

    - name: Test GitHub SSH connection
      shell: ssh -T git@github.com -o StrictHostKeyChecking=no
      become_user: "{{ ansible_user }}"
      register: github_ssh_test
      ignore_errors: yes
      changed_when: false

    - name: Display GitHub SSH test result
      debug:
        msg: "GitHub SSH: {{ github_ssh_test.stderr if github_ssh_test.stderr else github_ssh_test.stdout }}"

    - name: Clone application repository
      git:
        repo: "{{ repository_url }}"
        dest: "{{ app_directory }}"
        version: "{{ git_branch }}"
        force: yes
      become_user: "{{ ansible_user }}"
      environment:
        GIT_SSH_COMMAND: "ssh -i /home/{{ ansible_user }}/.ssh/id_rsa -o StrictHostKeyChecking=no"

    # MongoDB Database Setup
    - name: Create MongoDB database and user
      shell: |
        mongosh --eval "
        use {{ mongodb_database_name }};
        db.createUser({
          user: '{{ mongodb_username }}',
          pwd: '{{ mongodb_password }}',
          roles: [
            { role: 'readWrite', db: '{{ mongodb_database_name }}' },
            { role: 'dbAdmin', db: '{{ mongodb_database_name }}' }
          ]
        });"
      ignore_errors: yes
      no_log: true

    - name: Test MongoDB connection
      shell: |
        mongosh --eval "db.runCommand('ping').ok" {{ mongodb_database_name }}
      register: mongodb_test
      changed_when: false

    - name: Display MongoDB connection status
      debug:
        msg: "MongoDB connection: {{ 'SUCCESS' if mongodb_test.rc == 0 else 'FAILED' }}"

    # Task 2.3: Secrets Injection
    # Generate environment-specific secret keys
    # - name: Generate JWT secret key for application
    # shell: openssl rand -base64 32
    #  register: generated_jwt_secret
    #  when: jwt_secret is not defined or jwt_secret == ""
    #  delegate_to: localhost
    #  run_once: true

    - name: Generate API secret key for application  
      shell: openssl rand -hex 32
      register: generated_api_secret
      when: api_secret is not defined or api_secret == ""
      delegate_to: localhost
      run_once: true

    - name: Generate session secret for application
      shell: openssl rand -base64 48
      register: generated_session_secret
      when: session_secret is not defined or session_secret == ""
      delegate_to: localhost
      run_once: true

    - name: Set environment-specific secrets
      set_fact:
        jwt_secret_key: "{{ vault_api_keys['jwt_secret'] | default(generated_jwt_secret.stdout) }}"
        api_secret_key: "{{ vault_api_keys['api_key'] | default(generated_api_secret.stdout) }}"
        session_secret_key: "{{ vault_external_services['session_secret'] | default(generated_session_secret.stdout) }}"
        mongodb_password_env: "{{ mongodb_credentials.password }}"
        mongodb_username_env: "{{ mongodb_credentials.username }}"
        mongodb_database_env: "{{ mongodb_credentials.database }}"

    - name: Display generated secrets info (masked)
      debug:
        msg: 
          - "Environment: {{ env_name }}"
          - "JWT Secret: {{ 'SET' if jwt_secret_key else 'NOT SET' }}"
          - "API Secret: {{ 'SET' if api_secret_key else 'NOT SET' }}"
          - "Session Secret: {{ 'SET' if session_secret_key else 'NOT SET' }}"
          - "MongoDB Password: {{ 'SET' if mongodb_password_env else 'NOT SET' }}"

    - name: Create dynamic environment file from template
      template:
        src: app.env.j2
        dest: "{{ app_directory }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Copy environment-specific secrets file (fallback)
      copy:
        src: "{{ env_name }}.env"
        dest: "{{ app_directory }}/.env.backup"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      when: false  # Disabled in favor of template approach

    - name: Install application dependencies
      npm:
        path: "{{ app_directory }}"
        state: present
      become_user: "{{ ansible_user }}"

    # Task 2.4: Process Management
    - name: Create PM2 ecosystem file from template
      template:
        src: ecosystem.config.js.j2
        dest: "{{ app_directory }}/ecosystem.config.js"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Stop existing PM2 processes
      shell: pm2 delete {{ app_name }} || true
      become_user: "{{ ansible_user }}"
      ignore_errors: yes

    - name: Start application with PM2
      shell: pm2 start ecosystem.config.js
      args:
        chdir: "{{ app_directory }}"
      become_user: "{{ ansible_user }}"

    - name: Save PM2 configuration
      shell: pm2 save
      become_user: "{{ ansible_user }}"

    - name: Setup PM2 startup script
      shell: |
        pm2 startup systemd -u {{ ansible_user }} --hp /home/{{ ansible_user }} | tail -1
      register: pm2_startup_command
      become_user: "{{ ansible_user }}"

    - name: Execute PM2 startup command
      shell: "{{ pm2_startup_command.stdout }}"
      when: pm2_startup_command.stdout is defined and pm2_startup_command.stdout != ""

    # Task 2.5: Nginx Templating (Reverse Proxy) 
    - name: Remove default Nginx site
      file:
        path: "{{ nginx_sites_enabled }}/default"
        state: absent

    - name: Configure Nginx site from template
      template:
        src: nginx.conf.j2
        dest: "{{ nginx_sites_available }}/{{ app_name }}_{{ env_name }}"
        mode: '0644'
      notify: reload nginx

    - name: Enable Nginx site
      file:
        src: "{{ nginx_sites_available }}/{{ app_name }}_{{ env_name }}"
        dest: "{{ nginx_sites_enabled }}/{{ app_name }}_{{ env_name }}"
        state: link
      notify: reload nginx

    # Task 2.6: SSL Certification
    - name: Check if SSL certificate exists
      stat:
        path: "{{ ssl_cert_path }}"
      register: ssl_cert_check

    - name: Generate SSL certificate with Certbot
      shell: |
        certbot --nginx -d {{ domain_name }} \
        --non-interactive --agree-tos \
        --email {{ certbot_email }} \
        --redirect
      when: not ssl_cert_check.stat.exists

    - name: Set up automatic SSL renewal
      cron:
        name: "Certbot renewal"
        minute: "0"
        hour: "12"
        day: "*"
        month: "*"
        weekday: "*"
        job: "certbot renew --quiet --nginx"

    - name: Test SSL renewal
      shell: certbot renew --dry-run
      register: certbot_test
      ignore_errors: yes

    - name: Display SSL renewal test results
      debug:
        msg: "SSL renewal test: {{ 'PASSED' if certbot_test.rc == 0 else 'FAILED' }}"

    # CloudWatch Logging Configuration
    - name: Create CloudWatch log group
      shell: |
        aws logs create-log-group --log-group-name "{{ cloudwatch_log_group }}" --region {{ cloudwatch_region }} || true
      ignore_errors: yes

    - name: Configure CloudWatch agent
      template:
        src: cloudwatch-config.json.j2
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        mode: '0644'
      notify: restart cloudwatch

    - name: Ensure services are running
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - mongod

    - name: Force HTTPS redirection
      template:
        src: nginx.conf.j2
        dest: "{{ nginx_sites_available }}/{{ app_name }}_{{ env_name }}"
        mode: '0644'
      notify: reload nginx
      when: ssl_enabled and force_https

    # Health Checks
    - name: Verify Node.js and MongoDB services
      shell: |
        echo "Node.js: $(node --version)"
        echo "npm: $(npm --version)"
        echo "PM2: $(pm2 --version)"
        echo "MongoDB: $(mongosh --version)"
      register: service_versions
      changed_when: false

    - name: Display service versions
      debug:
        msg: "{{ service_versions.stdout_lines }}"

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart mongodb
      systemd:
        name: mongod
        state: restarted
        enabled: yes

    - name: restart cloudwatch
      systemd:
        name: amazon-cloudwatch-agent
        state: restarted
        enabled: yes